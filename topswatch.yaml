# topswatch.yaml

# HTTP server settings (used in web/Prometheus mode, the default)
server:
  address: "0.0.0.0"
  port: 9876

# Collection settings
collector:
  interval: 1s
  history: 300
  # How often to walk every process (new GPU/NPU clients, top-CPU list).
  # Known clients are still read every interval. 0 = walk every interval.
  process_rescan: 5s
  # Confine the daemon to these CPUs: low_power, efficient, performance,
  # or a list like 12-15. Unset = wherever the scheduler puts it.
  # cpus: low_power

# Collector modules
collectors:
  cpu:
    enabled: true
  gpu:
    enabled: true
  npu:
    enabled: true
  # RAPL energy domains and battery system power; adapts to what exists.
  power:
    enabled: true
